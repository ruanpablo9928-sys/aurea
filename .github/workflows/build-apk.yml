name: Build APK (Release)

on:
  workflow_dispatch:
  push:
    tags: ['apk-*', 'v*']

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.2

      - name: Setup Android SDK NDK & CMake
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;28.2.13676358" "cmake;3.22.1" || true

      - name: Dependencias
        run: flutter pub get

      - name: Build APK (Release)
        run: |
          set -o pipefail
          flutter build apk --release -v 2>&1 | tee build-apk.log

      - name: Guardar diagnostico da compilacao
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apk-build-diagnostics
          path: build-apk.log
          if-no-files-found: ignore

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: aurea-apk
          path: build/app/outputs/flutter-apk/app-release.apk
